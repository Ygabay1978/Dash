<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>יומן פגישות לקוח — Postman</title>
<style>
:root{
  --orange:#FF6C37;
  --ink:#1C1C1E;
  --grey:#5B5F66;
  --line:#E6E4E0;
  --bg-card:#FBFAF8;
  --blue:#2F5FA8;
  --red:#D64545;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:#E3E6EA;
  color:var(--ink);
  font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
header{
  background:var(--ink);
  color:#fff;
  padding:12px 24px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-shrink:0;
}
header h1{font-size:16px;margin:0;font-weight:700;}
header .sub{font-size:12px;color:#B9B9BC;margin-right:auto;}
#tab-bar{
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:4px;
  padding:8px 16px;
  overflow-x:auto;
  flex-shrink:0;
}
.company-tab{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--bg-card);
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 12px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
}
.company-tab:hover{border-color:var(--orange);}
.company-tab.active{background:#FFF6F1;border-color:var(--orange);color:var(--orange);}
.company-tab .tab-close{
  background:none;border:none;color:var(--grey);
  font-size:13px;cursor:pointer;line-height:1;padding:0;
}
.company-tab .tab-close:hover{color:var(--red);}
#add-tab-btn{
  background:var(--orange);color:#fff;border:none;border-radius:8px;
  padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;
}
#add-tab-btn:hover{background:#e85a28;}
#content-area{
  flex:1;
  overflow-y:auto;
  padding:24px 32px 60px;
}
#layout-row{
  display:flex;
  gap:20px;
  align-items:flex-start;
  max-width:1300px;
  margin:0 auto;
}
.wrap{flex:1;min-width:0;max-width:760px;}
.side-panel{width:230px;flex-shrink:0;}
.side-panel .side-card{
  background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,20,20,.06);
}
.side-panel h4{font-size:11.5px;margin:0 0 12px;color:var(--grey);text-transform:uppercase;letter-spacing:.03em;}
@media (max-width: 1050px){ .side-panel{ display:none; } }

.empty-state{
  text-align:center;
  color:var(--grey);
  padding:80px 20px;
  font-size:14px;
}
.company-header{margin-bottom:20px;}
.company-header h2{font-size:24px;margin:0 0 4px;}
.company-header .meta{font-size:13px;color:var(--grey);}
.snap-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px 20px;
  margin-bottom:20px;
  box-shadow:0 1px 3px rgba(20,20,20,0.06);
}
.snap-hint{color:var(--grey);font-size:12.5px;margin-bottom:12px;font-style:italic;}

/* ---- editable stat boxes (Check Point style) ---- */
.stat-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px;}
.stat-box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 16px;
  flex:1 1 130px;
  min-width:120px;
}
.stat-box .label{font-size:10.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.stat-box .value{font-size:19px;font-weight:800;color:var(--orange);outline:none;border-radius:4px;padding:1px 3px;margin:-1px -3px;}
.stat-box .value:focus{background:#FFF6F1;}
.stat-box .value:empty:before{content:'—';color:var(--grey);font-weight:400;}
.stat-hint{font-size:10.5px;color:var(--grey);margin-top:10px;}

.snap-note{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--line);
  font-size:13px;
  white-space:pre-wrap;
  color:var(--ink);
  outline:none;
  min-height:18px;
}
.snap-note:focus{background:#FFFBF8;}
.snap-note:empty:before{content:'הוסף הערה כללית על הלקוח...';color:var(--grey);}

/* ---- contacts list (Monday.com-style) ---- */
.snap-contacts{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.contacts-list .contact-line{text-align:right;font-size:14px;margin-bottom:10px;line-height:1.5;}
.contacts-list .contact-line:last-child{margin-bottom:0;}
.contacts-list .contact-line b{font-weight:700;}
.contacts-list .contact-line .role{color:var(--grey);}
.contacts-list .contact-line .email-link{color:var(--blue);text-decoration:none;}
.contacts-list .contact-line .email-link:hover{text-decoration:underline;}

/* ---- teams table (Monday.com-style) ---- */
.teams-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px;}
.teams-table th{
  font-size:11px;text-transform:uppercase;color:var(--grey);font-weight:700;
  text-align:right;padding:8px 10px;border-bottom:2px solid var(--line);
}
.teams-table td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);}
.teams-table .cell-arr{font-weight:700;color:var(--ink);}
.teams-table .cell-num{color:var(--blue);}
.teams-table .cell-team{color:var(--blue);font-weight:600;}

.notes-section h3{font-size:15px;margin:0 0 12px;}
#add-note-btn{
  background:var(--orange);color:#fff;border:none;border-radius:6px;
  padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:16px;
}
#add-note-btn:hover{background:#e85a28;}
.note-entry{
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px 16px;
  margin-bottom:12px;
  box-shadow:0 1px 2px rgba(20,20,20,0.04);
}
.note-entry .note-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  gap:10px;
}
.note-entry .note-date{
  font-size:12px;font-weight:700;color:var(--orange);
  border:none;background:none;font-family:inherit;flex-shrink:0;
}
.note-controls{display:flex;align-items:center;gap:2px;}
.note-controls button{
  background:none;border:none;color:var(--grey);font-size:13px;cursor:pointer;
  padding:3px 6px;border-radius:4px;line-height:1;
}
.note-controls button:hover{color:var(--orange);background:var(--bg-card);}
.note-controls button:disabled{opacity:.3;cursor:default;}
.note-controls button:disabled:hover{color:var(--grey);background:none;}
.note-controls .note-delete:hover{color:var(--red);background:var(--bg-card);}
.note-entry .note-text{
  font-size:14px;line-height:1.6;min-height:40px;outline:none;white-space:pre-wrap;
}
.note-entry .note-text:focus{background:#FFFBF8;}
.note-entry.collapsed .note-text{display:none;}
.notes-empty{color:var(--grey);font-size:13px;padding:10px 0;}

/* ---- side panel: diagrams ---- */
.chart-row{display:flex;align-items:center;gap:6px;margin-bottom:7px;font-size:11px;}
.chart-row .chart-label{width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--grey);flex-shrink:0;}
.chart-bar-track{flex:1;background:#F1EFEA;border-radius:4px;height:9px;overflow:hidden;}
.chart-bar-fill{height:100%;background:var(--orange);border-radius:4px;}
.chart-bar-fill.blue{background:var(--blue);}
.chart-value{width:44px;text-align:left;font-size:10px;color:var(--ink);font-weight:700;flex-shrink:0;}
.side-empty{color:var(--grey);font-size:12px;font-style:italic;}

/* ---- side panel: insights + personal notes ---- */
.flag-list{list-style:none;margin:0;padding:0;}
.flag-list li{font-size:12px;line-height:1.5;margin-bottom:8px;color:var(--ink);}
.personal-note{
  font-size:12.5px;line-height:1.55;min-height:80px;outline:none;white-space:pre-wrap;color:var(--ink);
}
.personal-note:focus{background:#FFFBF8;}
.personal-note:empty:before{content:'כתוב כאן הערות אישיות, פעולות המשך, רישיונות לטפל בהם...';color:var(--grey);}
</style>
</head>
<body>
<header>
  <h1>📓 יומן פגישות לקוח</h1>
  <span class="sub">Snapshot חי + הערות שנשארות בין פגישות, לפי חברה</span>
</header>

<div id="tab-bar">
  <button id="add-tab-btn">+ חברה חדשה</button>
</div>

<div id="content-area">
  <div id="layout-row">
    <div class="side-panel" id="side-notes"></div>
    <div class="wrap" id="wrap-inner">
      <div class="empty-state">לחץ על "+ חברה חדשה" כדי להתחיל תיעוד פגישה.</div>
    </div>
    <div class="side-panel" id="side-diagrams"></div>
  </div>
</div>

<script>
(function(){
  const TABS_KEY = 'meeting-notes-tabs';
  const ACTIVE_KEY = 'meeting-notes-active-tab';
  function entriesKey(name){ return 'meeting-notes-entries:' + name.trim().toLowerCase(); }
  function overridesKey(name){ return 'meeting-notes-overrides:' + name.trim().toLowerCase(); }
  function personalKey(name){ return 'meeting-notes-personal:' + name.trim().toLowerCase(); }

  let DATA = null;
  let tabs = [];
  let activeTab = null;

  function loadTabs(){
    try{ return JSON.parse(localStorage.getItem(TABS_KEY)) || []; }catch(e){ return []; }
  }
  function saveTabs(){
    try{ localStorage.setItem(TABS_KEY, JSON.stringify(tabs)); }catch(e){}
  }
  function loadEntries(name){
    try{ return JSON.parse(localStorage.getItem(entriesKey(name))) || []; }catch(e){ return []; }
  }
  function saveEntries(name, entries){
    try{ localStorage.setItem(entriesKey(name), JSON.stringify(entries)); }catch(e){}
  }
  function loadOverrides(name){
    try{ return JSON.parse(localStorage.getItem(overridesKey(name))) || {}; }catch(e){ return {}; }
  }
  function saveOverrides(name, overrides){
    try{ localStorage.setItem(overridesKey(name), JSON.stringify(overrides)); }catch(e){}
  }
  function loadPersonalNote(name){
    try{ return localStorage.getItem(personalKey(name)) || ''; }catch(e){ return ''; }
  }
  function savePersonalNote(name, html){
    try{ localStorage.setItem(personalKey(name), html); }catch(e){}
  }
  function todayStr(){
    const d = new Date();
    return d.toLocaleDateString('he-IL', { year: 'numeric', month: '2-digit', day: '2-digit' });
  }

  // Fuzzy name matching: strips spaces/hyphens/dots/underscores before comparing,
  // so "Global E", "Global-E", "GLOBAL-E" etc. all resolve to the same record.
  function normKey(s){
    return (s || '').toLowerCase().replace(/[\s\-_.]+/g, '');
  }

  function renderTabBar(){
    const bar = document.getElementById('tab-bar');
    bar.querySelectorAll('.company-tab').forEach(el => el.remove());
    tabs.forEach(name=>{
      const tab = document.createElement('button');
      tab.className = 'company-tab' + (name === activeTab ? ' active' : '');
      tab.innerHTML = '<span class="tab-label"></span><span class="tab-close" title="הסר טאב (ההערות נשארות שמורות)">✕</span>';
      tab.querySelector('.tab-label').textContent = name;
      tab.addEventListener('click', (e)=>{
        if(e.target.classList.contains('tab-close')) return;
        setActiveTab(name);
      });
      tab.querySelector('.tab-close').addEventListener('click', (e)=>{
        e.stopPropagation();
        closeTab(name);
      });
      bar.insertBefore(tab, document.getElementById('add-tab-btn'));
    });
  }

  function closeTab(name){
    tabs = tabs.filter(t => t !== name);
    saveTabs();
    if(activeTab === name){
      activeTab = tabs.length ? tabs[tabs.length - 1] : null;
      try{ localStorage.setItem(ACTIVE_KEY, activeTab || ''); }catch(e){}
    }
    renderTabBar();
    renderContent();
  }

  function setActiveTab(name){
    activeTab = name;
    try{ localStorage.setItem(ACTIVE_KEY, activeTab || ''); }catch(e){}
    renderTabBar();
    renderContent();
  }

  function addTab(name){
    name = name.trim();
    if(!name) return;
    if(!tabs.includes(name)){
      tabs.push(name);
      saveTabs();
    }
    setActiveTab(name);
  }

  document.getElementById('add-tab-btn').addEventListener('click', ()=>{
    const name = window.prompt('שם החברה:');
    if(name && name.trim()) addTab(name);
  });

  // ---- snapshot lookup (fuzzy-matched against dashboard-data.json) ----
  function findAccount(name){
    const target = normKey(name);
    return (DATA.accounts || []).find(a => normKey(a.name) === target) || null;
  }
  function findUsage(name){
    const target = normKey(name);
    return (DATA.usage_export || []).find(u => normKey(u.name) === target) || null;
  }
  function findByFuzzyKey(dict, name){
    if(!dict) return null;
    const target = normKey(name);
    for(const key in dict){
      if(normKey(key) === target) return dict[key];
    }
    return null;
  }
  function findTeams(name){
    return findByFuzzyKey(DATA.teams_by_account, name) ||
           (findByFuzzyKey(DATA.self_serve_renewals, name) || {}).teams ||
           [];
  }
  function findContacts(name){
    return findByFuzzyKey(DATA.contacts_by_account, name) || [];
  }
  function fmtMoney(n){ return (n === null || n === undefined || n === '') ? '—' : '$' + Number(n).toLocaleString(); }
  function fmtNum(n){ return (n === null || n === undefined || n === '') ? '—' : Number(n).toLocaleString(); }

  const STAT_FIELDS = [
    { key:'country',  label:'מדינה' },
    { key:'sector',   label:'סקטור' },
    { key:'status',   label:'סטטוס' },
    { key:'priority', label:'Priority' },
    { key:'arr',      label:'ARR' },
    { key:'dau',      label:'DAU (90 יום)' },
    { key:'paid',     label:'רישיונות בתשלום' },
    { key:'teams',    label:'Postman Teams' }
  ];

  function defaultStatValues(account, usage){
    const arr = (account && (account.arr_live ?? account.arr)) ?? (usage && usage.combined_arr);
    return {
      country:  account ? (account.country || '') : '',
      sector:   account ? (account.sector || '') : '',
      status:   account ? (account.status || '') : '',
      priority: account ? (account.priority || '') : '',
      arr:      fmtMoney(arr),
      dau:      usage ? fmtNum(usage.dau_90) : '—',
      paid:     usage ? fmtNum(usage.paid_licenses) : '—',
      teams:    usage ? fmtNum(usage.postman_teams) : '—'
    };
  }

  function renderSnapshotCard(name){
    const account = findAccount(name);
    const usage = findUsage(name);
    const teams = findTeams(name);
    const contacts = findContacts(name);
    const overrides = loadOverrides(name);
    const defaults = defaultStatValues(account, usage);

    let html = '<div class="snap-card">';

    if(!account && !usage){
      html += '<div class="snap-hint">אין נתונים קיימים על "' + name + '" ב-Territory Command Center — כנראה לקוח/פרוספקט חדש, או שם שלא תואם בדיוק. אפשר למלא את הפרטים כאן ידנית.</div>';
    }

    html += '<div class="stat-grid">';
    STAT_FIELDS.forEach(f=>{
      const val = (overrides[f.key] !== undefined) ? overrides[f.key] : defaults[f.key];
      html += '<div class="stat-box"><div class="label">' + f.label + '</div>' +
              '<div class="value" contenteditable="true" data-field="' + f.key + '">' + (val || '') + '</div></div>';
    });
    html += '</div>';
    html += '<div class="stat-hint">שדות אלה ניתנים לעריכה — השינויים נשמרים בדפדפן הזה.</div>';

    const accountNotesDefault = (account && account.notes) ? account.notes.replace(/\n/g, '<br>') : '';
    const accountNotesValue = (overrides.accountNotes !== undefined) ? overrides.accountNotes : accountNotesDefault;
    html += '<div class="snap-note" contenteditable="true" data-field="accountNotes">' + accountNotesValue + '</div>';

    if(contacts.length){
      html += '<div class="snap-contacts"><div class="contacts-list">';
      contacts.slice(0, 8).forEach(c=>{
        html += '<div class="contact-line"><b>' + (c.name || '') + '</b>' +
                (c.title ? ' — <span class="role">' + c.title + '</span>' : '') +
                (c.email ? ' · <a class="email-link" href="mailto:' + c.email + '">' + c.email + '</a>' : '') +
                '</div>';
      });
      html += '</div></div>';
    }

    if(teams.length){
      html += '<table class="teams-table"><thead><tr><th>ARR</th><th>Purchased</th><th>Used</th><th>Plan</th><th>Team</th></tr></thead><tbody>';
      teams.slice(0, 10).forEach(t=>{
        html += '<tr>' +
                '<td class="cell-arr">' + fmtMoney(t.arr) + '</td>' +
                '<td class="cell-num">' + fmtNum(t.purchased_licenses) + '</td>' +
                '<td class="cell-num">' + fmtNum(t.used_licenses) + '</td>' +
                '<td>' + (t.active_plan || '—') + '</td>' +
                '<td class="cell-team">' + (t.team_name || '—') + '</td>' +
                '</tr>';
      });
      html += '</tbody></table>';
    }

    html += '</div>';
    return html;
  }

  function wireSnapshotCard(name){
    const card = document.querySelector('.snap-card');
    if(!card) return;
    card.querySelectorAll('[contenteditable][data-field]').forEach(el=>{
      el.addEventListener('blur', ()=>{
        const overrides = loadOverrides(name);
        overrides[el.dataset.field] = el.innerHTML;
        saveOverrides(name, overrides);
      });
    });
  }

  // ---- meeting notes ----
  function renderNotesSection(name){
    const entries = loadEntries(name);
    let html = '<div class="notes-section"><h3>הערות פגישה</h3>';
    html += '<button id="add-note-btn">+ הערה מפגישה חדשה</button>';
    html += '<div id="notes-list">';
    if(!entries.length){
      html += '<div class="notes-empty">אין עדיין הערות לחברה הזו. לחץ על הכפתור למעלה כדי להתחיל.</div>';
    } else {
      entries.forEach((entry, i)=>{
        const collapsed = !!entry.collapsed;
        html += '<div class="note-entry' + (collapsed ? ' collapsed' : '') + '" data-idx="' + i + '">' +
                '<div class="note-header">' +
                  '<input class="note-date" value="' + (entry.date || '') + '">' +
                  '<div class="note-controls">' +
                    '<button class="note-toggle" title="מזער/הרחב">' + (collapsed ? '▸' : '▾') + '</button>' +
                    '<button class="note-up" title="הזז מעלה"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
                    '<button class="note-down" title="הזז מטה"' + (i === entries.length - 1 ? ' disabled' : '') + '>▼</button>' +
                    '<button class="note-delete" title="מחק הערה זו">✕</button>' +
                  '</div>' +
                '</div>' +
                '<div class="note-text" contenteditable="true">' + (entry.text || '') + '</div>' +
                '</div>';
      });
    }
    html += '</div></div>';
    return html;
  }

  function wireNotesSection(name){
    document.getElementById('add-note-btn').addEventListener('click', ()=>{
      const entries = loadEntries(name);
      entries.unshift({ date: todayStr(), text: '', collapsed: false });
      saveEntries(name, entries);
      renderContent();
      const firstText = document.querySelector('.note-entry .note-text');
      if(firstText) firstText.focus();
    });

    document.querySelectorAll('.note-entry').forEach(el=>{
      const idx = parseInt(el.dataset.idx, 10);
      const dateInput = el.querySelector('.note-date');
      const textDiv = el.querySelector('.note-text');
      const delBtn = el.querySelector('.note-delete');
      const toggleBtn = el.querySelector('.note-toggle');
      const upBtn = el.querySelector('.note-up');
      const downBtn = el.querySelector('.note-down');

      function persist(){
        const entries = loadEntries(name);
        if(!entries[idx]) return;
        entries[idx].date = dateInput.value;
        entries[idx].text = textDiv.innerHTML;
        saveEntries(name, entries);
      }
      dateInput.addEventListener('input', persist);
      textDiv.addEventListener('input', persist);

      delBtn.addEventListener('click', ()=>{
        if(!window.confirm('למחוק את ההערה הזו?')) return;
        const entries = loadEntries(name);
        entries.splice(idx, 1);
        saveEntries(name, entries);
        renderContent();
      });

      toggleBtn.addEventListener('click', ()=>{
        const entries = loadEntries(name);
        if(!entries[idx]) return;
        entries[idx].collapsed = !entries[idx].collapsed;
        saveEntries(name, entries);
        renderContent();
      });

      upBtn.addEventListener('click', ()=>{
        if(idx === 0) return;
        const entries = loadEntries(name);
        const tmp = entries[idx - 1];
        entries[idx - 1] = entries[idx];
        entries[idx] = tmp;
        saveEntries(name, entries);
        renderContent();
      });

      downBtn.addEventListener('click', ()=>{
        const entries = loadEntries(name);
        if(idx === entries.length - 1) return;
        const tmp = entries[idx + 1];
        entries[idx + 1] = entries[idx];
        entries[idx] = tmp;
        saveEntries(name, entries);
        renderContent();
      });
    });
  }

  // ---- side panel: diagrams (pulled from Territory data) ----
  function chartRows(items, labelFn, valueFn, colorClass){
    const max = Math.max(1, ...items.map(valueFn));
    return items.map(item=>{
      const val = valueFn(item);
      const pct = Math.max(2, Math.round((val / max) * 100));
      return '<div class="chart-row">' +
             '<div class="chart-label">' + labelFn(item) + '</div>' +
             '<div class="chart-bar-track"><div class="chart-bar-fill ' + (colorClass||'') + '" style="width:' + pct + '%"></div></div>' +
             '<div class="chart-value">' + val.toLocaleString() + '</div>' +
             '</div>';
    }).join('');
  }

  function renderDiagramsPanel(name){
    const teams = findTeams(name);
    let html = '<div class="side-card"><h4>📊 ARR לפי Team</h4>';
    const arrTeams = teams.filter(t => (t.arr || 0) > 0).sort((a,b)=>(b.arr||0)-(a.arr||0)).slice(0,6);
    if(arrTeams.length){
      html += chartRows(arrTeams, t => (t.team_name || '—'), t => Math.round(t.arr || 0), '');
    } else {
      html += '<div class="side-empty">אין נתוני ARR להצגה.</div>';
    }
    html += '</div>';

    html += '<div class="side-card"><h4>👥 משתמשים פעילים לפי Team</h4>';
    const usedTeams = teams.filter(t => (t.used_licenses || 0) > 0).sort((a,b)=>(b.used_licenses||0)-(a.used_licenses||0)).slice(0,6);
    if(usedTeams.length){
      html += chartRows(usedTeams, t => (t.team_name || '—'), t => Math.round(t.used_licenses || 0), 'blue');
    } else {
      html += '<div class="side-empty">אין נתוני שימוש להצגה.</div>';
    }
    html += '</div>';
    return html;
  }

  // ---- side panel: insights + personal notes ----
  function computeActionFlags(teams){
    const flags = [];
    teams.forEach(t=>{
      const status = (t.status || '').toLowerCase();
      const plan = (t.active_plan || '').toLowerCase();
      if(status === 'delinquent'){
        flags.push('⚠️ <b>' + (t.team_name || 'Team') + '</b> — סטטוס Delinquent, דורש טיפול בחשבונית/תשלום.');
      }
      if(plan === 'free' && (t.used_licenses || 0) >= 3){
        flags.push('💡 <b>' + (t.team_name || 'Team') + '</b> — ' + t.used_licenses + ' משתמשים פעילים בחינם, הזדמנות אפסייל.');
      }
    });
    return flags;
  }

  function renderInsightsPanel(name){
    const teams = findTeams(name);
    const flags = computeActionFlags(teams);
    let html = '<div class="side-card"><h4>🔎 נקודות לתשומת לב</h4>';
    if(flags.length){
      html += '<ul class="flag-list">' + flags.map(f => '<li>' + f + '</li>').join('') + '</ul>';
    } else {
      html += '<div class="side-empty">לא נמצאו דגלים אוטומטיים כרגע.</div>';
    }
    html += '</div>';

    const personalNote = loadPersonalNote(name);
    html += '<div class="side-card"><h4>✏️ הערות אישיות</h4>' +
            '<div class="personal-note" contenteditable="true" data-personal-note="1">' + personalNote + '</div></div>';
    return html;
  }

  function wireInsightsPanel(name){
    const el = document.querySelector('.personal-note[data-personal-note]');
    if(!el) return;
    el.addEventListener('blur', ()=>{
      savePersonalNote(name, el.innerHTML);
    });
  }

  function renderContent(){
    const wrap = document.getElementById('wrap-inner');
    const sideDiagrams = document.getElementById('side-diagrams');
    const sideNotes = document.getElementById('side-notes');
    if(!activeTab){
      wrap.innerHTML = '<div class="empty-state">לחץ על "+ חברה חדשה" כדי להתחיל תיעוד פגישה.</div>';
      sideDiagrams.innerHTML = '';
      sideNotes.innerHTML = '';
      return;
    }
    let html = '<div class="company-header"><h2>' + activeTab + '</h2></div>';
    html += renderSnapshotCard(activeTab);
    html += renderNotesSection(activeTab);
    wrap.innerHTML = html;
    wireSnapshotCard(activeTab);
    wireNotesSection(activeTab);

    sideDiagrams.innerHTML = renderDiagramsPanel(activeTab);
    sideNotes.innerHTML = renderInsightsPanel(activeTab);
    wireInsightsPanel(activeTab);
  }

  async function init(){
    try{
      const response = await fetch('dashboard-data.json');
      DATA = await response.json();
    }catch(e){
      DATA = { accounts: [], usage_export: [], teams_by_account: {}, contacts_by_account: {}, self_serve_renewals: {} };
      console.error('Could not load dashboard-data.json — snapshots will show "not found" until this file is available in the same folder.', e);
    }
    tabs = loadTabs();
    let savedActive = null;
    try{ savedActive = localStorage.getItem(ACTIVE_KEY); }catch(e){}
    activeTab = (savedActive && tabs.includes(savedActive)) ? savedActive : (tabs[0] || null);
    renderTabBar();
    renderContent();
  }

  init();
})();
</script>

<style>
#dash-switcher{position:fixed;bottom:20px;left:20px;z-index:2147483000;font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;direction:rtl;}
#dash-switcher-btn{
  width:48px;height:48px;border-radius:50%;
  background:#1C1C1E;color:#fff;border:none;
  font-size:20px;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
}
#dash-switcher-btn:hover{background:#FF6C37;}
#dash-switcher-menu{
  display:none;position:absolute;bottom:58px;left:0;
  background:#fff;border:1px solid #E6E4E0;border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  padding:8px;min-width:230px;
}
#dash-switcher-menu.open{display:block;}
#dash-switcher-menu .dash-switcher-title{
  font-size:11px;font-weight:700;color:#5B5F66;
  padding:4px 10px 8px;text-transform:uppercase;letter-spacing:.02em;
}
#dash-switcher-menu a{
  display:block;padding:8px 10px;border-radius:6px;
  color:#1C1C1E;text-decoration:none;font-size:13px;white-space:nowrap;
}
#dash-switcher-menu a:hover{background:#FFF6F1;color:#FF6C37;}
#dash-switcher-menu a.current{font-weight:700;color:#FF6C37;background:#FFF6F1;}
</style>
<script>
(function(){
  if(window.self !== window.top){
    document.getElementById('dash-switcher').style.display = 'none';
    return;
  }
  const btn = document.getElementById('dash-switcher-btn');
  const wrap = document.getElementById('dash-switcher');
  const menu = document.getElementById('dash-switcher-menu');
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  document.addEventListener('click', function(e){
    if(!wrap.contains(e.target)) menu.classList.remove('open');
  });
  const current = (location.pathname.split('/').pop() || 'index.html');
  menu.querySelectorAll('a').forEach(function(a){
    if(a.getAttribute('href') === current) a.classList.add('current');
  });
  try{
    const saved = JSON.parse(localStorage.getItem('home-cards-order-and-text'));
    if(saved && saved.length){
      const linksByKey = {};
      menu.querySelectorAll('a[data-key]').forEach(a => linksByKey[a.dataset.key] = a);
      saved.forEach(entry=>{
        const a = linksByKey[entry.key];
        if(!a) return;
        const temp = document.createElement('div');
        temp.innerHTML = entry.title;
        const plainTitle = temp.textContent.trim();
        const icon = a.textContent.trim().split(' ')[0];
        a.textContent = icon + ' ' + plainTitle;
        menu.appendChild(a);
      });
    }
  }catch(e){}
})();
</script>
